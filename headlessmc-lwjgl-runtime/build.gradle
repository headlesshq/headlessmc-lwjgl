description = 'The parts of the runtime of the patched LWJGL that do not depend on an LWJGL version, embedded into the patched core jar.'

dependencies {
    compileOnly project(':headlessmc-lwjgl-api')
    // only for compile time constants, which javac inlines, the runtime must not refer to LWJGL 3 classes
    compileOnly libs.lwjgl.opengl
}

tasks.named('compileJava', JavaCompile) {
    options.release = 8
}
