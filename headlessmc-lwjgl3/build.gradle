description = 'Patched, headless LWJGL 3 jars that never load native libraries.'

ext.patchedLwjgl = [
    flavor         : 'lwjgl3',
    dependencies   : libs.bundles.lwjgl.get(),
    version        : libs.versions.lwjgl.get(),
    compatVersions : providers.gradleProperty('lwjgl3.compatVersions').get().split(',').collect { it.trim() },
    runtime        : ':headlessmc-lwjgl3-runtime',
    japicmp        : libs.japicmp,
    japicmpExcludes: ['org.lwjgl.panama.*'],
]
apply from: rootProject.file('gradle/patched-lwjgl.gradle')

def patchedDirectory = ext.patchedDirectory
def patchedJars = ext.patchedJars
def patchLwjgl = tasks.named('patchLwjgl')

def testModulePath = tasks.register('testModulePath', JavaExec) {
    group = 'verification'
    description = 'Runs the startup calls with the patched jars as named modules on the module path.'
    dependsOn patchLwjgl
    def apiJar = project(':headlessmc-lwjgl-api').tasks.named('jar').flatMap { it.archiveFile }
    dependsOn ':headlessmc-lwjgl-api:jar'
    classpath = sourceSets.test.runtimeClasspath.filter {
        !it.absolutePath.startsWith(patchedDirectory.get().asFile.absolutePath) && it != apiJar.get().asFile
    }
    mainClass = 'io.github.headlesshq.headlessmc.lwjgl3.ModulePathCheck'
    jvmArgumentProviders.add({
        ['--module-path', patchedDirectory.get().asFile.absolutePath + File.pathSeparator + apiJar.get().asFile.absolutePath,
         '--add-modules', 'ALL-MODULE-PATH']
    } as CommandLineArgumentProvider)
}

tasks.named('check') {
    dependsOn testModulePath
}


def strippedApiJar = tasks.register('strippedApiJar', Jar) {
    description = 'The API jar without module descriptors, as HeadlessMc puts it on the classpath.'
    dependsOn ':headlessmc-lwjgl-api:jar'
    def apiJar = project(':headlessmc-lwjgl-api').tasks.named('jar').flatMap { it.archiveFile }
    from(apiJar.map { zipTree(it) }) {
        exclude '**/module-info.class'
        exclude 'META-INF/MANIFEST.MF'
    }
    manifest {
        from(apiJar.map { zipTree(it).matching { include 'META-INF/MANIFEST.MF' }.singleFile })
    }
    archiveFileName = 'headlessmc-lwjgl-api.jar'
    destinationDirectory = layout.buildDirectory.dir('stripped-api')
}

def testModuleLayer = tasks.register('testModuleLayer', JavaExec) {
    group = 'verification'
    description = 'Like testModulePath, with the API jar as an automatic module, like Forge and NeoForge load it.'
    dependsOn patchLwjgl, strippedApiJar
    def apiJar = project(':headlessmc-lwjgl-api').tasks.named('jar').flatMap { it.archiveFile }
    classpath = sourceSets.test.runtimeClasspath.filter {
        !it.absolutePath.startsWith(patchedDirectory.get().asFile.absolutePath) && it != apiJar.get().asFile
    }
    mainClass = 'io.github.headlesshq.headlessmc.lwjgl3.ModulePathCheck'
    jvmArgumentProviders.add({
        ['--module-path', patchedDirectory.get().asFile.absolutePath + File.pathSeparator + strippedApiJar.get().archiveFile.get().asFile.absolutePath,
         '--add-modules', 'ALL-MODULE-PATH']
    } as CommandLineArgumentProvider)
}

tasks.named('check') {
    dependsOn testModuleLayer
}
