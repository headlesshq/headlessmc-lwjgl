name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # never cancel runs on main, they might be creating a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Patch, test and check the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the tests run on Java 8, 17, 21 and 25, Gradle uses the last one installed
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check
        run: ./gradlew check --stacktrace

      - name: Publish to the build repository
        run: ./gradlew publish --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headlessmc-lwjgl
          path: build/maven

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            **/build/reports/**

  release:
    name: Upload the release jars
    # the release itself (tag and notes) has been created by release-please, the jars are the ones that passed check
    if: needs.release-please.outputs.release_created == 'true'
    needs: [ release-please, check ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headlessmc-lwjgl
          path: maven

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir assets
          find maven -name "*-$TAG_NAME.jar" -exec cp {} assets \;
          (cd assets && sha256sum *.jar > SHA256SUMS)
          ls -l assets
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber assets/*
