name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    name: Patch, test and check the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the tests run on Java 8, 17, 21 and 25, Gradle uses the last one installed
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check
        run: ./gradlew check --stacktrace

      - name: Publish to the build repository
        run: ./gradlew publish --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headlessmc-lwjgl
          path: build/maven

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            **/build/reports/**
