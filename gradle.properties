org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2G

version=0.1.0

# LWJGL versions whose public API the patched jars must stay binary compatible with:
# every LWJGL 3 version Minecraft shipped plus every version we published before.
# Deliberately not in libs.versions.toml, so that Renovate never bumps it.
lwjgl3.compatVersions=3.1.6,3.2.1,3.2.2,3.3.1,3.3.2,3.3.3
