org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2G

# x-release-please-start-version
version=0.1.0
# x-release-please-end

# LWJGL versions whose public API the patched jars must stay binary compatible with:
# every LWJGL 3 version Minecraft shipped plus every version we published before.
# Deliberately not in libs.versions.toml, so that Renovate never bumps it.
lwjgl3.compatVersions=3.1.6,3.2.1,3.2.2,3.3.1,3.3.2,3.3.3

# LWJGL 2 versions whose public API the patched LWJGL 2.9.4 must stay binary compatible with:
# every LWJGL 2 version Minecraft shipped that is still available (2.9.1-nightly-20130708-debug3 is not).
lwjgl2.compatVersions=2.9.0,2.9.1,2.9.2-nightly-20140822
