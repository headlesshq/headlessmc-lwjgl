subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'io.github.headlesshq'

    repositories {
        mavenCentral()
        maven {
            name = 'Minecraft'
            url = 'https://libraries.minecraft.net'
            content {
                includeGroup 'org.lwjgl.lwjgl'
            }
        }
    }

    dependencies {
        testImplementation platform(libs.junit.bom)
        testImplementation libs.junit.jupiter
        testRuntimeOnly libs.junit.launcher
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:-options'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat 'full'
        }
    }

    java {
        withSourcesJar()
    }

    publishing {
        repositories {
            maven {
                url = rootProject.layout.buildDirectory.dir('maven')
            }
        }
    }
}

/**
 * Stages the patched jars in the layout of HeadlessMc's hmc.lwjgl.patched-directory, so that HeadlessMc launches
 * Minecraft with this build instead of the locked release.
 */
tasks.register('headlessMcDirectory', Sync) {
    group = 'build'
    description = 'Stages the patched jars for -Dhmc.lwjgl.patched-directory=build/headlessmc.'
    into layout.buildDirectory.dir('headlessmc')
    from(project(':headlessmc-lwjgl3').tasks.named('patchLwjgl')) {
        include '*.jar'
        into 'lwjgl3'
    }
    from(project(':headlessmc-lwjgl2').tasks.named('patchLwjgl')) {
        include '*.jar'
        into 'lwjgl2'
    }
    from(project(':headlessmc-lwjgl-api').tasks.named('jar')) {
        rename { 'headlessmc-lwjgl-api.jar' }
    }
}
