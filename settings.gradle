pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'headlessmc-lwjgl'

include 'headlessmc-lwjgl-api'

include 'headlessmc-lwjgl-patcher'
include 'headlessmc-lwjgl-runtime'

include 'headlessmc-lwjgl3'
include 'headlessmc-lwjgl3-runtime'
project(':headlessmc-lwjgl3-runtime').projectDir = file('headlessmc-lwjgl3/runtime')

include 'lwjgl3-probe'
project(':lwjgl3-probe').projectDir = file('tools/lwjgl3-probe')
