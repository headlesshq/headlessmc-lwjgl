[versions]
asm = "9.11.1"
japicmp = "0.26.5"
junit = "5.14.4"
lwjgl = "3.4.3"
lwjgl2 = "2.9.4-nightly-20150209"

[libraries]
jinput = { group = "net.java.jinput", name = "jinput", version = "2.0.5" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version.ref = "asm" }

japicmp = { group = "com.github.siom79.japicmp", name = "japicmp", version.ref = "japicmp" }

junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

lwjgl = { group = "org.lwjgl", name = "lwjgl", version.ref = "lwjgl" }
lwjgl-freetype = { group = "org.lwjgl", name = "lwjgl-freetype", version.ref = "lwjgl" }
lwjgl-glfw = { group = "org.lwjgl", name = "lwjgl-glfw", version.ref = "lwjgl" }
lwjgl-jemalloc = { group = "org.lwjgl", name = "lwjgl-jemalloc", version.ref = "lwjgl" }
lwjgl-openal = { group = "org.lwjgl", name = "lwjgl-openal", version.ref = "lwjgl" }
lwjgl-opengl = { group = "org.lwjgl", name = "lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-sdl = { group = "org.lwjgl", name = "lwjgl-sdl", version.ref = "lwjgl" }
lwjgl-shaderc = { group = "org.lwjgl", name = "lwjgl-shaderc", version.ref = "lwjgl" }
lwjgl-spvc = { group = "org.lwjgl", name = "lwjgl-spvc", version.ref = "lwjgl" }
lwjgl-stb = { group = "org.lwjgl", name = "lwjgl-stb", version.ref = "lwjgl" }
lwjgl-tinyfd = { group = "org.lwjgl", name = "lwjgl-tinyfd", version.ref = "lwjgl" }
lwjgl-vma = { group = "org.lwjgl", name = "lwjgl-vma", version.ref = "lwjgl" }
lwjgl-vulkan = { group = "org.lwjgl", name = "lwjgl-vulkan", version.ref = "lwjgl" }

lwjgl2 = { group = "org.lwjgl.lwjgl", name = "lwjgl", version.ref = "lwjgl2" }
lwjgl2-util = { group = "org.lwjgl.lwjgl", name = "lwjgl_util", version.ref = "lwjgl2" }

[bundles]
lwjgl = [
    "lwjgl", "lwjgl-freetype", "lwjgl-glfw", "lwjgl-jemalloc", "lwjgl-openal", "lwjgl-opengl", "lwjgl-sdl",
    "lwjgl-shaderc", "lwjgl-spvc", "lwjgl-stb", "lwjgl-tinyfd", "lwjgl-vma", "lwjgl-vulkan"
]
lwjgl2 = ["lwjgl2", "lwjgl2-util"]
